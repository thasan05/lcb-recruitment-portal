  <text x="100" y="44" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="38" fill="white" text-anchor="middle">C</text>

  <!-- B block -->
  <rect x="140" y="0" width="60" height="60" rx="10" fill="#0A66C2"/>
  <rect x="140" y="0" width="60" height="60" rx="10" fill="url(#shine)"/>
  <text x="170" y="44" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="38" fill="white" text-anchor="middle">B</text>
