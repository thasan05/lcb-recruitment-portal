  <text x="30" y="44" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="38" fill="white" text-anchor="middle">L</text>

  <!-- C block -->
  <rect x="70" y="0" width="60" height="60" rx="10" fill="#0A66C2"/>
